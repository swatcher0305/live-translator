<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiveEcho 即時動態聽譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121212;
      border-bottom: 1px solid #222;
    }
    select, button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button.active {
      background: #ff3b30;
      border-color: #ff3b30;
      color: #fff;
      font-weight: bold;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item {
      background: #141414;
      border-left: 4px solid #30d158;
      padding: 10px 12px;
      border-radius: 4px;
    }
    .orig {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .trans {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 600;
      color: #ffd60a;
      word-break: break-word;
    }
    /* 正在講話、持續動態覆寫的卡片 */
    .dynamic-active {
      border-left-color: #0a84ff;
      background: #0d1624;
      border: 1px solid rgba(10, 132, 255, 0.4);
    }
    .dynamic-active .trans {
      color: #60a5fa; /* 動態修正時顯示天藍色 */
    }
    .status {
      padding: 6px 12px;
      font-size: 11px;
      color: #555;
      text-align: center;
      background: #0a0a0a;
    }
  </style>
</head>
<body>

  <header>
    <select id="lang">
      <option value="en-US">英語 (English)</option>
      <option value="ja-JP">日本語 (Japanese)</option>
      <option value="ko-KR">韓語 (Korean)</option>
      <option value="zh-TW">中文 (國語)</option>
    </select>
    <button id="btn">啟動收音</button>
  </header>

  <div id="log">
    <!-- 當前動態覆寫區 -->
    <div class="item dynamic-active" id="liveCard">
      <div class="orig" id="currOrig">等待台上聲音...</div>
      <div class="trans" id="currTrans">即時動態翻譯中...</div>
    </div>
  </div>

  <div class="status" id="statusBar">狀態：待命</div>

  <script>
    const btn = document.getElementById('btn');
    const lang = document.getElementById('lang');
    const log = document.getElementById('log');
    const currOrig = document.getElementById('currOrig');
    const currTrans = document.getElementById('currTrans');
    const statusBar = document.getElementById('statusBar');
    const liveCard = document.getElementById('liveCard');

    let recognition = null;
    let running = false;
    let debounceTimer = null;
    let activeAbortController = null;
    let lastFinalText = "";

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert("請使用 iPhone Safari 開啟！");
    } else {
      initSpeech();
    }

    function initSpeech() {
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = lang.value;

      recognition.onstart = () => {
        statusBar.innerText = "● 收音辨識中（支援動態意圖覆寫）";
      };

      recognition.onresult = (e) => {
        let interim = '';
        let finalChunk = '';

        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalChunk += e.results[i][0].transcript;
          } else {
            interim += e.results[i][0].transcript;
          }
        }

        const fullSentence = (finalChunk || interim).trim();
        if (!fullSentence) return;

        // 1. 原文即時顯示
        currOrig.innerText = fullSentence;

        // 2. 動態覆寫核心：只要講者補新字，立刻中斷舊請求，250ms 後覆寫最新翻譯
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          streamTranslate(fullSentence, Boolean(finalChunk));
        }, 250);
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          statusBar.innerText = "重新適應環境收音中 (" + e.error + ")";
        }
      };

      recognition.onend = () => {
        if (running) {
          try { recognition.start(); } catch(err){}
        }
      };
    }

    // 支援中斷前一次請求的動態覆寫傳輸
    async function streamTranslate(text, isFinal) {
      if (activeAbortController) {
        activeAbortController.abort(); // 掐斷舊詞請求，防止舊翻譯覆蓋新意圖
      }
      activeAbortController = new AbortController();

      const sourceLang = lang.value.split('-')[0];
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`;

      try {
        const res = await fetch(url, { signal: activeAbortController.signal });
        const json = await res.json();
        if (json && json[0]) {
          const newTranslation = json[0].map(x => x[0]).join('');
          // 動態替換目前螢幕上的中文
          currTrans.innerText = newTranslation;

          // 若說完一段停頓確定定稿，固化到歷史列表
          if (isFinal && text !== lastFinalText) {
            lastFinalText = text;
            commitCard(text, newTranslation);
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error("翻譯錯誤:", err);
        }
      }
    }

    // 固化卡片
    function commitCard(orig, trans) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="orig">${orig}</div><div class="trans" style="color: #ffd60a;">${trans}</div>`;
      log.insertBefore(div, liveCard);
      log.scrollTop = log.scrollHeight;

      currOrig.innerText = "聆聽中...";
      currTrans.innerText = "...";
    }

    btn.addEventListener('click', () => {
      if (!running) {
        recognition.lang = lang.value;
        try { recognition.start(); } catch(e){}
        running = true;
        btn.innerText = "停止";
        btn.classList.add('active');
      } else {
        running = false;
        recognition.stop();
        if (activeAbortController) activeAbortController.abort();
        btn.innerText = "啟動收音";
        btn.classList.remove('active');
        statusBar.innerText = "狀態：已停止";
      }
    });

    lang.addEventListener('change', () => {
      if (running) {
        recognition.stop();
        setTimeout(() => {
          recognition.lang = lang.value;
          recognition.start();
        }, 200);
      }
    });
  </script>
</body>
</html>
