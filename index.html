<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiveEcho 即時聽譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121212;
      border-bottom: 1px solid #222;
    }
    select, button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button.active {
      background: #ff3b30;
      border-color: #ff3b30;
      color: #fff;
      font-weight: bold;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item {
      background: #141414;
      border-left: 4px solid #30d158;
      padding: 10px 12px;
      border-radius: 4px;
    }
    .orig {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .trans {
      font-size: 24px;
      line-height: 1.35;
      font-weight: 600;
      color: #ffd60a;
      word-break: break-word;
    }
    /* 當前正在講話的動態卡片（邊說邊跑） */
    .live-stream {
      border-left-color: #38bdf8;
      background: #081524;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .live-stream .trans {
      color: #38bdf8;
    }
    .status {
      padding: 6px 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
      background: #0a0a0a;
    }
  </style>
</head>
<body>

  <header>
    <select id="lang">
      <option value="en">英語 (English)</option>
      <option value="ja">日本語 (Japanese)</option>
      <option value="ko">韓語 (Korean)</option>
      <option value="zh-TW">中文 (國語)</option>
    </select>
    <button id="btn">啟動收音</button>
  </header>

  <div id="log">
    <div class="item live-stream" id="liveCard">
      <div class="orig" id="currOrig">等待台上聲音...</div>
      <div class="trans" id="currTrans">即時中文字幕將隨講話滾動</div>
    </div>
  </div>

  <div class="status" id="statusBar">狀態：待命中</div>

  <script>
    const btn = document.getElementById('btn');
    const lang = document.getElementById('lang');
    const log = document.getElementById('log');
    const currOrig = document.getElementById('currOrig');
    const currTrans = document.getElementById('currTrans');
    const statusBar = document.getElementById('statusBar');
    const liveCard = document.getElementById('liveCard');

    let recognition = null;
    let running = false;
    let streamTimer = null;
    let lastQueryText = "";
    let lastSavedSentence = "";

    const speechLangMap = {
      'en': 'en-US',
      'ja': 'ja-JP',
      'ko': 'ko-KR',
      'zh-TW': 'zh-TW'
    };

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert("請使用 iPhone Safari 開啟！");
    } else {
      initSpeech();
    }

    function initSpeech() {
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = speechLangMap[lang.value];

      recognition.onstart = () => {
        statusBar.innerText = "● 即時收音中（隨講隨翻）";
      };

      recognition.onresult = (e) => {
        let interim = '';
        let finalChunk = '';

        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalChunk += e.results[i][0].transcript;
          } else {
            interim += e.results[i][0].transcript;
          }
        }

        const activeText = (finalChunk || interim).trim();
        if (!activeText) return;

        currOrig.innerText = activeText;

        // 核心改進：不再等講完，講話中途每 150ms 極速捕捉並翻譯
        clearTimeout(streamTimer);
        streamTimer = setTimeout(() => {
          liveTranslate(activeText, Boolean(finalChunk));
        }, 150);
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          statusBar.innerText = "收音調適中 (" + e.error + ")";
        }
      };

      recognition.onend = () => {
        if (running) {
          try { recognition.start(); } catch(err){}
        }
      };
    }

    // 極速 JSONP 動態通道（穿透 Safari CORS，延遲僅約 100ms）
    function liveTranslate(text, isFinal) {
      if (!text || text === lastQueryText) return;
      lastQueryText = text;

      const sl = lang.value;
      const tl = 'zh-TW';
      const callbackName = 'gtx_' + Math.floor(Math.random() * 1000000);

      window[callbackName] = function(data) {
        try {
          if (data && data[0]) {
            const translated = data[0].map(x => x[0]).join('');
            if (translated) {
              currTrans.innerText = translated;

              // 當講者停頓確認一句結束，將其定稿轉為上方歷史卡片
              if (isFinal && text !== lastSavedSentence) {
                lastSavedSentence = text;
                archiveSentence(text, translated);
              }
            }
          }
        } finally {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
        }
      };

      const script = document.createElement('script');
      script.src = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    function archiveSentence(orig, trans) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="orig">${orig}</div><div class="trans" style="color: #ffd60a;">${trans}</div>`;
      log.insertBefore(div, liveCard);
      log.scrollTop = log.scrollHeight;

      currOrig.innerText = "正在聆聽...";
      currTrans.innerText = "...";
    }

    btn.addEventListener('click', () => {
      if (!running) {
        recognition.lang = speechLangMap[lang.value];
        try { recognition.start(); } catch(e){}
        running = true;
        btn.innerText = "停止";
        btn.classList.add('active');
      } else {
        running = false;
        recognition.stop();
        btn.innerText = "啟動收音";
        btn.classList.remove('active');
        statusBar.innerText = "狀態：已停止";
      }
    });

    lang.addEventListener('change', () => {
      if (running) {
        recognition.stop();
        setTimeout(() => {
          recognition.lang = speechLangMap[lang.value];
          recognition.start();
        }, 200);
      }
    });
  </script>
</body>
</html>
