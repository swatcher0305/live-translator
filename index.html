<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiveEcho 現場即時聽譯 v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2833;
      border-bottom: 1px solid #333;
    }
    select, button {
      background: #45a29e;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    button.listening {
      background: #ff4d4d;
      color: white;
    }
    .content-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .history-card {
      background: #161b22;
      border-radius: 8px;
      padding: 12px 14px;
      border-left: 4px solid #45a29e;
    }
    .history-card .source {
      font-size: 14px;
      color: #888;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .history-card .trans {
      font-size: 22px;
      line-height: 1.4;
      font-weight: bold;
      color: #ffd60a;
      word-break: break-word;
    }
    .current-card {
      border: 1px solid #66fcf1;
      background: #101720;
    }
    .current-card .trans {
      color: #66fcf1;
    }
    .hint {
      color: #888;
      font-size: 11px;
      text-align: center;
      padding: 6px;
      background: #1f2833;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <select id="langSelect">
        <option value="en-US">英文 (English)</option>
        <option value="ja-JP">日文 (日本語)</option>
        <option value="ko-KR">韓文 (한국어)</option>
        <option value="zh-TW">中文 (國語)</option>
      </select>
    </div>
    <button id="toggleBtn">開始收音翻譯</button>
  </header>

  <div class="content-area" id="subtitleContainer">
    <div class="history-card current-card" id="activeCard">
      <div class="source" id="sourceText">等待台上聲音...</div>
      <div class="trans" id="translatedText">【v2 最新版】中文翻譯將在此顯示</div>
    </div>
  </div>

  <div class="hint">稍微停頓 0.5 秒即自動翻出繁中</div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const langSelect = document.getElementById('langSelect');
    const subtitleContainer = document.getElementById('subtitleContainer');
    const sourceText = document.getElementById('sourceText');
    const translatedText = document.getElementById('translatedText');
    const activeCard = document.getElementById('activeCard');

    let isListening = false;
    let recognition = null;
    let wakeLock = null;
    let pauseTimer = null;
    let lastProcessed = "";

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("請使用 iPhone Safari 開啟！");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const currentSaid = (finalTranscript || interimTranscript).trim();
        if (!currentSaid) return;

        sourceText.innerText = currentSaid;

        // 停頓 500ms 快速出字
        clearTimeout(pauseTimer);
        pauseTimer = setTimeout(() => {
          if (currentSaid !== lastProcessed) {
            doTranslate(currentSaid);
          }
        }, 500);
      };

      recognition.onerror = (e) => {
        console.error("收音提示:", e);
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    // 繁中翻譯核心
    async function doTranslate(text) {
      lastProcessed = text;
      const src = langSelect.value.split('-')[0];
      translatedText.innerText = "翻譯中...";

      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|zh-TW`);
        const data = await res.json();
        
        let result = "";
        if (data && data.responseData && data.responseData.translatedText) {
          result = data.responseData.translatedText;
          if (result.includes("MYMEMORY WARNING") && data.matches && data.matches.length > 0) {
            result = data.matches[0].translation;
          }
        }

        if (result) {
          translatedText.innerText = result;
          archiveCard(text, result);
        }
      } catch (err) {
        translatedText.innerText = "連線重試中...";
      }
    }

    function archiveCard(src, trans) {
      const card = document.createElement('div');
      card.className = 'history-card';
      card.innerHTML = `
        <div class="source">${src}</div>
        <div class="trans">${trans}</div>
      `;
      subtitleContainer.insertBefore(card, activeCard);
      subtitleContainer.scrollTop = subtitleContainer.scrollHeight;
      
      sourceText.innerText = "繼續聆聽中...";
      translatedText.innerText = "...";
    }

    toggleBtn.addEventListener('click', () => {
      if (!isListening) {
        recognition.lang = langSelect.value;
        try { recognition.start(); } catch(e){}
        requestWakeLock();
        isListening = true;
        toggleBtn.innerText = "停止收音";
        toggleBtn.classList.add('listening');
      } else {
        recognition.stop();
        if (wakeLock) wakeLock.release();
        isListening = false;
        toggleBtn.innerText = "開始收音翻譯";
        toggleBtn.classList.remove('listening');
      }
    });

    langSelect.addEventListener('change', () => {
      if (isListening) {
        recognition.stop();
        setTimeout(() => {
          recognition.lang = langSelect.value;
          recognition.start();
        }, 200);
      }
    });
  </script>
</body>
</html>
