<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiveEcho 即時聽譯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121212;
      border-bottom: 1px solid #222;
    }
    select, button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button.active {
      background: #ff3b30;
      border-color: #ff3b30;
      color: #fff;
      font-weight: bold;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item {
      background: #141414;
      border-left: 4px solid #30d158;
      padding: 10px 12px;
      border-radius: 4px;
    }
    .orig {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .trans {
      font-size: 24px;
      line-height: 1.35;
      font-weight: 600;
      color: #ffd60a;
      word-break: break-word;
    }
    .dynamic-active {
      border-left-color: #0a84ff;
      background: #0d1624;
      border: 1px solid rgba(10, 132, 255, 0.4);
    }
    .dynamic-active .trans {
      color: #60a5fa;
    }
    .status {
      padding: 6px 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
      background: #0a0a0a;
    }
  </style>
</head>
<body>

  <header>
    <select id="lang">
      <option value="en">英語 (English)</option>
      <option value="ja">日本語 (Japanese)</option>
      <option value="ko">韓語 (Korean)</option>
      <option value="zh-TW">中文 (國語)</option>
    </select>
    <button id="btn">啟動收音</button>
  </header>

  <div id="log">
    <div class="item dynamic-active" id="liveCard">
      <div class="orig" id="currOrig">等待台上聲音...</div>
      <div class="trans" id="currTrans">即時動態翻譯將顯示於此</div>
    </div>
  </div>

  <div class="status" id="statusBar">狀態：待命中</div>

  <script>
    const btn = document.getElementById('btn');
    const lang = document.getElementById('lang');
    const log = document.getElementById('log');
    const currOrig = document.getElementById('currOrig');
    const currTrans = document.getElementById('currTrans');
    const statusBar = document.getElementById('statusBar');
    const liveCard = document.getElementById('liveCard');

    let recognition = null;
    let running = false;
    let debounceTimer = null;
    let lastCommitText = "";
    let isTranslating = false;

    // 映射語言代碼給收音用
    const speechLangMap = {
      'en': 'en-US',
      'ja': 'ja-JP',
      'ko': 'ko-KR',
      'zh-TW': 'zh-TW'
    };

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert("請使用 iPhone Safari 開啟！");
    } else {
      initSpeech();
    }

    function initSpeech() {
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = speechLangMap[lang.value];

      recognition.onstart = () => {
        statusBar.innerText = "● 正在持續收音與辨識中...";
      };

      recognition.onresult = (e) => {
        let interim = '';
        let finalChunk = '';

        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalChunk += e.results[i][0].transcript;
          } else {
            interim += e.results[i][0].transcript;
          }
        }

        const fullSentence = (finalChunk || interim).trim();
        if (!fullSentence) return;

        currOrig.innerText = fullSentence;

        // 防抖 300ms 動態翻譯，避免快速講話時卡住
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          doTranslate(fullSentence, Boolean(finalChunk));
        }, 300);
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          statusBar.innerText = "重新連線麥克風 (" + e.error + ")";
        }
      };

      recognition.onend = () => {
        if (running) {
          try { recognition.start(); } catch(err){}
        }
      };
    }

    // 解決 CORS 跨域限制的翻譯通道
    async function doTranslate(text, isFinal) {
      if (isTranslating) return;
      isTranslating = true;
      const sl = lang.value;
      const tl = 'zh-TW';

      try {
        // 使用支援 CORS 的公開端點
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`);
        const data = await res.json();
        
        let translated = "";
        if (data && data.responseData && data.responseData.translatedText) {
          translated = data.responseData.translatedText;
          // 若 API 回傳全大寫警告，取 match 陣列備用
          if (translated.includes("MYMEMORY WARNING")) {
            if (data.matches && data.matches.length > 0) {
              translated = data.matches[0].translation;
            }
          }
        }

        if (translated) {
          currTrans.innerText = translated;

          // 說完整句固化至卡片
          if (isFinal && text !== lastCommitText) {
            lastCommitText = text;
            commitCard(text, translated);
          }
        }
      } catch (err) {
        console.error("翻譯失敗:", err);
      } finally {
        isTranslating = false;
      }
    }

    function commitCard(orig, trans) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="orig">${orig}</div><div class="trans" style="color: #ffd60a;">${trans}</div>`;
      log.insertBefore(div, liveCard);
      log.scrollTop = log.scrollHeight;

      currOrig.innerText = "聆聽下一句中...";
      currTrans.innerText = "...";
    }

    btn.addEventListener('click', () => {
      if (!running) {
        recognition.lang = speechLangMap[lang.value];
        try { recognition.start(); } catch(e){}
        running = true;
        btn.innerText = "停止";
        btn.classList.add('active');
      } else {
        running = false;
        recognition.stop();
        btn.innerText = "啟動收音";
        btn.classList.remove('active');
        statusBar.innerText = "狀態：已停止";
      }
    });

    lang.addEventListener('change', () => {
      if (running) {
        recognition.stop();
        setTimeout(() => {
          recognition.lang = speechLangMap[lang.value];
          recognition.start();
        }, 200);
      }
    });
  </script>
</body>
</html>
